name: Pages

# Publica a demo em https://victornascimento14.github.io/Arcada/ a cada merge na
# `main`. Pré-requisito único: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. O que já começou termina em vez de ser cancelado no meio;
# de vários merges seguidos, só o mais recente espera na fila.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O site mora em /Arcada/, não na raiz do domínio: sem BASE_PATH todo
      # asset e todo link do build apontariam para /assets/... e dariam 404.
      - run: npm run build
        env:
          BASE_PATH: /Arcada/
      # O Pages não tem fallback de SPA, mas serve o 404.html em qualquer
      # caminho que não existe. Com o conteúdo do index.html, recarregar numa
      # rota interna carrega o app (o roteador assume a rota) em vez da página
      # de erro do GitHub.
      - run: cp out/index.html out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
